name: EU PvP Horde monitor
on:
  workflow_dispatch:
    inputs:
      test_push:
        description: Send a clearly labelled cloud test push only
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: wow-horde-monitor
  cancel-in-progress: false
jobs:
  monitor:
    # Stopped at the user's request after successful character creation.
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      GH_TOKEN: ${{ github.token }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check detector fixtures
        run: node --test monitor.test.mjs
      - name: Check current reports
        id: check
        if: ${{ !inputs.test_push }}
        run: node monitor.mjs
      - name: Send cloud test
        if: ${{ inputs.test_push }}
        run: node monitor.mjs --test-push
      - name: Record setup or runtime failure using the shared alert policy
        if: ${{ failure() && !inputs.test_push }}
        shell: bash
        run: |
          # Use this exact commit even if checkout failed. Never push directly.
          script="$RUNNER_TEMP/monitor-failure.mjs"
          if [ -f monitor.mjs ]; then
            cp monitor.mjs "$script"
          else
            curl --fail --silent --show-error --max-time 20 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github.raw+json' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/monitor.mjs?ref=$GITHUB_SHA" \
              --output "$script"
          fi
          node "$script" --record-failure
