name: EU PvP Horde monitor
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      test_push:
        description: Send a clearly labelled cloud test push only
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: wow-horde-monitor
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      GH_TOKEN: ${{ github.token }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check detector fixtures
        run: node --test monitor.test.mjs
      - name: Check current reports
        id: check
        if: ${{ !inputs.test_push }}
        run: node monitor.mjs
      - name: Send cloud test
        if: ${{ inputs.test_push }}
        run: node monitor.mjs --test-push
      - name: Report setup or runtime failure
        if: ${{ failure() && steps.check.outcome != 'failure' }}
        shell: bash
        run: |
          # Covers failures before monitor.mjs can report (for example checkout).
          if [ -n "$NTFY_TOPIC" ]; then
            auth=()
            if [ -n "$NTFY_TOKEN" ]; then auth=(-H "Authorization: Bearer $NTFY_TOKEN"); fi
            curl --fail --silent --show-error --max-time 20 \
              -H 'Title: MONITOR CHECK FAILED - GitHub workflow' \
              -H 'Priority: high' \
              "${auth[@]}" \
              --data "Cloud workflow failed. Inspect https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID . This is NOT a reopening alert." \
              "https://ntfy.sh/$NTFY_TOPIC"
          fi

